services:
  - type: keyvalue
    name: pokedex-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: pokedex-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pokedex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pokedex-cache
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pokedex-frontend.onrender.com
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,pokedex-backend
      - key: ENVIRONMENT
        value: production

  - type: web
    name: pokedex-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps --include=dev && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://pokedex-backend-kor1.onrender.com

databases:
  - name: pokedex-db
    plan: free
    databaseName: pokedex
    user: pokedex
    postgresMajorVersion: "15"
    ipAllowList: []
