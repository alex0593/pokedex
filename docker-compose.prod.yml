# docker-compose.prod.yml — Producción / Servidor
#
# Diferencias clave vs docker-compose.yml (dev):
#   - PostgreSQL y Redis: sin `ports:` → solo accesibles dentro de pokedex-network
#   - Backend:   host:8000 → container:8000  (Nginx proxia /api/* aquí)
#   - Frontend:  corre con PM2 fuera de Docker en el puerto 3000
#   - Todas las credenciales vienen del archivo .env en la raíz del proyecto
#
# Uso:
#   cp .env.prod.example .env          # edita con valores reales
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  # ── PostgreSQL 15 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pokedex}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    # Sin `ports` — solo accesible dentro de pokedex-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pokedex-network
    restart: unless-stopped

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    # Sin `ports` — solo accesible dentro de pokedex-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pokedex-network
    restart: unless-stopped

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"   # solo accesible desde localhost (Nginx/Next.js)
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pokedex}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pokedex-network
    restart: unless-stopped

  # El frontend corre con PM2 fuera de Docker (ver pasos de deploy)

networks:
  pokedex-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
