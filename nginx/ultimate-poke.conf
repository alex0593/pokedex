# =============================================================================
# Nginx — Virtual Host: ultimate-poke.sytes.net
# Arquitectura:
#   - HTTPS termina aquí (Let's Encrypt / Certbot)
#   - /api/*    → FastAPI backend en Docker  (localhost:8000)
#   - /*        → Next.js frontend via PM2   (localhost:3000)
# =============================================================================

# ── HTTP: ACME challenge (Certbot) + redirect a HTTPS ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ultimate-poke.sytes.net;

    # Certbot coloca aquí los tokens de validación
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → forzar HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: Proxy reverso principal ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ultimate-poke.sytes.net;

    # Certificados generados por Certbot
    ssl_certificate     /etc/letsencrypt/live/ultimate-poke.sytes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultimate-poke.sytes.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Headers de seguridad ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header X-XSS-Protection          "1; mode=block"  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # ── API FastAPI (Docker expone puerto 4004 al host) ───────────────────────
    location /api/ {
        proxy_pass          http://127.0.0.1:4004/;   # trailing slash = strip /api
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ── Swagger / ReDoc (docs de FastAPI accesibles en /docs) ────────────────
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass          http://127.0.0.1:4004;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── Frontend Next.js (PM2 corre Next.js en puerto 4003) ──────────────────
    location / {
        proxy_pass          http://127.0.0.1:4003;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  60s;
    }
}
